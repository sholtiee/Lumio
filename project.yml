name: Lumio
options:
  bundleIdPrefix: app.lumio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: V3NZFAGWAF
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  LumioKit:
    type: framework
    platform: macOS
    sources: [LumioKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumio.LumioKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  LumioKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LumioKitTests]
    dependencies:
      - target: LumioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumio.LumioKitTests
        GENERATE_INFOPLIST_FILE: YES
  Lumio:
    type: application
    platform: macOS
    sources:
      - path: Lumio
    dependencies:
      - target: LumioKit
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lumio.Lumio
        PRODUCT_NAME: Lumio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Lumio"
        SWIFT_OBJC_BRIDGING_HEADER: Lumio/Private/Lumio-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
schemes:
  Lumio:
    build:
      targets:
        Lumio: all
        LumioKitTests: [test]
    test:
      targets: [LumioKitTests]
    run:
      config: Debug
